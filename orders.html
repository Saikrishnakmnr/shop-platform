<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">SHOP</a><nav id="site-nav"></nav></div></header><main class="container" style="padding:35px 0"><h1>My Orders</h1><div id="list"></div></main><script type="module">import'./js/config.js';import{shell,user,money,esc}from'./js/app.js';import{supabase}from'./js/supabase.js';await shell('orders');let u=await user();if(!u){location.href='login.html'}else{let{data}=await supabase.from('orders').select('*,order_items(*)').eq('customer_id',u.id).order('created_at',{ascending:false});list.innerHTML=(data||[]).map(o=>`<div class="panel" style="margin:10px 0"><div class="between"><strong>#${o.order_number}</strong><b>${esc(o.status)}</b></div><p>${money(o.total)} • ${new Date(o.created_at).toLocaleString()}</p>${(o.order_items||[]).map(i=>`<div>${esc(i.product_name)} × ${i.quantity}</div>`).join('')}</div>`).join('')||'<div class="empty">No orders.</div>'}</script></body></html>
