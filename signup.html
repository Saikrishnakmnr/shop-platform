<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signup</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container" style="max-width:500px;padding:60px 0"><a class="brand" href="index.html">SHOP</a><div class="panel"><h1>Create account</h1><form id="form" class="grid"><input id="name" class="input" required placeholder="Full name"><input id="email" class="input" type="email" required placeholder="Email"><input id="password" class="input" minlength="6" type="password" required placeholder="Password"><button class="btn">Create account</button></form><p id="msg" class="muted"></p></div></main><script type="module">import'./js/config.js';import{supabase}from'./js/supabase.js';form.onsubmit=async e=>{e.preventDefault();let{data,error}=await supabase.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}});if(error)msg.textContent=error.message;else if(data.session)location.href='account.html';else msg.textContent='Account created. Check your email.'}</script></body></html>
