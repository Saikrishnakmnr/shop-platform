<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-layout"><aside class="side"><a class="brand" href="index.html">SHOP ADMIN</a><hr><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="delivery.html">Delivery</a><a href="coupons.html">Coupons</a><a href="offers.html">Offers</a><a href="payments.html">Payments</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="../account.html">Store</a></aside><main class="admin-main"><h1>Categories</h1><div id="list" class="panel">Loading…</div></main></div><script type="module">import'../js/config.js';import{role,esc}from'../js/app.js';import{supabase}from'../js/supabase.js';if(await role(['admin','staff'])){let{data,error}=await supabase.from('categories').select('*').limit(300);list.innerHTML=error?`<div class="panel">${esc(error.message)}</div>`:((data||[]).length?`<div style="overflow:auto"><table><tr><th>Name</th><th>Slug</th><th>Active</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name ?? "")}</td><td>${esc(x.slug ?? "")}</td><td>${esc(x.active ?? "")}</td></tr>`).join('')}</table></div>`:'<div class="empty">No records.</div>')}}</script></body></html>
