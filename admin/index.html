<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-layout"><aside class="side"><a class="brand" href="index.html">SHOP ADMIN</a><hr><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="delivery.html">Delivery</a><a href="coupons.html">Coupons</a><a href="offers.html">Offers</a><a href="payments.html">Payments</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="../account.html">Store</a></aside><main class="admin-main"><div id="view">Loading…</div></main></div><script type="module">import'../js/config.js';import{role,money}from'../js/app.js';import{supabase}from'../js/supabase.js';let p=await role(['admin','staff']);if(p){let[a,b,c]=await Promise.all([supabase.from('products').select('*',{count:'exact',head:true}),supabase.from('orders').select('*',{count:'exact',head:true}),supabase.from('profiles').select('*',{count:'exact',head:true}).eq('role','customer')]);view.innerHTML=`<h1>Dashboard</h1><div class="cards"><div class="panel stat">Products<strong>${a.count||0}</strong></div><div class="panel stat">Orders<strong>${b.count||0}</strong></div><div class="panel stat">Customers<strong>${c.count||0}</strong></div><div class="panel stat">Role<strong>${p.role}</strong></div></div>`}</script></body></html>
