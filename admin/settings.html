<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-layout"><aside class="side"><a class="brand" href="index.html">SHOP ADMIN</a><hr><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="delivery.html">Delivery</a><a href="coupons.html">Coupons</a><a href="offers.html">Offers</a><a href="payments.html">Payments</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="../account.html">Store</a></aside><main class="admin-main"><h1>Store settings</h1><div class="panel"><form id="form" class="form-grid"><input id="name" class="input" placeholder="Store name"><input id="phone" class="input" placeholder="Phone"><input id="whatsapp" class="input" placeholder="WhatsApp"><input id="free" class="input" type="number" placeholder="Free delivery above"><input id="maxkm" class="input" type="number" placeholder="Maximum delivery km"><label><input id="closed" type="checkbox"> Store closed</label><button class="btn span2">Save</button></form><p id="msg"></p></div></main></div><script type="module">import'../js/config.js';import{role}from'../js/app.js';import{supabase}from'../js/supabase.js';if(await role(['admin'])){let{data}=await supabase.from('store_settings').select('*');let s=Object.fromEntries((data||[]).map(x=>[x.key,x.value]));name.value=s.name||'SHOP';phone.value=s.phone||'';whatsapp.value=s.whatsapp||'';free.value=s.free_delivery||750;maxkm.value=s.max_delivery_km||10;closed.checked=s.closed==='true';form.onsubmit=async e=>{e.preventDefault();for(let[k,v]of Object.entries({name:name.value,phone:phone.value,whatsapp:whatsapp.value,free_delivery:free.value,max_delivery_km:maxkm.value,closed:String(closed.checked)}))await supabase.from('store_settings').upsert({key:k,value:v});msg.textContent='Saved.'}}</script></body></html>
