<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-layout"><aside class="side"><a class="brand" href="index.html">SHOP ADMIN</a><hr><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="delivery.html">Delivery</a><a href="coupons.html">Coupons</a><a href="offers.html">Offers</a><a href="payments.html">Payments</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="../account.html">Store</a></aside><main class="admin-main"><h1>Payments</h1><div id="list" class="panel">Loading…</div></main></div><script type="module">import'../js/config.js';import{role,esc}from'../js/app.js';import{supabase}from'../js/supabase.js';if(await role(['admin','staff'])){let{data,error}=await supabase.from('payments').select('*').limit(300);list.innerHTML=error?`<div class="panel">${esc(error.message)}</div>`:((data||[]).length?`<div style="overflow:auto"><table><tr><th>Order Id</th><th>Provider</th><th>Amount</th><th>Status</th><th>Created At</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.order_id ?? "")}</td><td>${esc(x.provider ?? "")}</td><td>${esc(x.amount ?? "")}</td><td>${esc(x.status ?? "")}</td><td>${esc(x.created_at ?? "")}</td></tr>`).join('')}</table></div>`:'<div class="empty">No records.</div>')}}</script></body></html>
