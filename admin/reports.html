<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-layout"><aside class="side"><a class="brand" href="index.html">SHOP ADMIN</a><hr><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="delivery.html">Delivery</a><a href="coupons.html">Coupons</a><a href="offers.html">Offers</a><a href="payments.html">Payments</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="../account.html">Store</a></aside><main class="admin-main"><h1>Reports</h1><div id="view"></div></main></div><script type="module">import'../js/config.js';import{role,money}from'../js/app.js';import{supabase}from'../js/supabase.js';if(await role(['admin','staff'])){let{data}=await supabase.from('orders').select('total,status');let x=data||[];view.innerHTML=`<div class="cards"><div class="panel stat">Orders<strong>${x.length}</strong></div><div class="panel stat">Gross<strong>${money(x.reduce((a,o)=>a+Number(o.total||0),0))}</strong></div><div class="panel stat">Delivered<strong>${x.filter(o=>o.status==='DELIVERED').length}</strong></div><div class="panel stat">Cancelled<strong>${x.filter(o=>o.status==='CANCELLED').length}</strong></div></div>`}</script></body></html>
