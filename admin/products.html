<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-layout"><aside class="side"><a class="brand" href="index.html">SHOP ADMIN</a><hr><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a href="customers.html">Customers</a><a href="delivery.html">Delivery</a><a href="coupons.html">Coupons</a><a href="offers.html">Offers</a><a href="payments.html">Payments</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="../account.html">Store</a></aside><main class="admin-main"><div class="between"><h1>Products</h1><button id="new" class="btn">Add product</button></div><div id="list" class="panel"></div><div id="modal" class="modal"><div class="panel"><div class="between"><h2>Product</h2><button id="close" class="btn secondary">Close</button></div><form id="form" class="form-grid"><input type="hidden" id="id"><input id="name" class="input" required placeholder="Name"><input id="slug" class="input" required placeholder="Slug"><input id="price" class="input" type="number" step=".01" required placeholder="Price"><input id="sale" class="input" type="number" step=".01" placeholder="Sale price"><input id="unit" class="input" placeholder="Unit"><select id="category" class="input"></select><input id="image" class="input span2" placeholder="Image URL"><textarea id="desc" class="input span2" placeholder="Description"></textarea><label><input id="active" type="checkbox" checked> Active</label><label><input id="featured" type="checkbox"> Featured</label><button class="btn span2">Save</button></form></div></div></main></div><script type="module">import'../js/config.js';import{role,esc,money}from'../js/app.js';import{supabase}from'../js/supabase.js';if(await role(['admin','staff'])){let cats=(await supabase.from('categories').select('*').order('name')).data||[];category.innerHTML='<option value="">No category</option>'+cats.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');let data=[];async function load(){data=(await supabase.from('products').select('*').order('created_at',{ascending:false})).data||[];list.innerHTML=`<table><tr><th>Name</th><th>Price</th><th>Active</th><th></th></tr>${data.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.sale_price??x.price)}</td><td>${x.active?'Yes':'No'}</td><td><button data-e="${x.id}" class="btn secondary">Edit</button> <button data-d="${x.id}" class="btn danger">Delete</button></td></tr>`).join('')}</table>`;list.onclick=async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.d){await supabase.from('products').delete().eq('id',b.dataset.d);load()}else if(b.dataset.e)open(data.find(x=>x.id===b.dataset.e))}}function open(x){modal.classList.add('open');form.reset();if(x){id.value=x.id;name.value=x.name;slug.value=x.slug;price.value=x.price;sale.value=x.sale_price??'';unit.value=x.unit||'';category.value=x.category_id||'';image.value=x.image_url||'';desc.value=x.description||'';active.checked=x.active;featured.checked=x.featured}}new.onclick=()=>open(null);close.onclick=()=>modal.classList.remove('open');form.onsubmit=async e=>{e.preventDefault();let x={name:name.value,slug:slug.value,price:+price.value,sale_price:sale.value?+sale.value:null,unit:unit.value,category_id:category.value||null,image_url:image.value||null,description:desc.value,active:active.checked,featured:featured.checked};let r=id.value?await supabase.from('products').update(x).eq('id',id.value):await supabase.from('products').insert(x);if(r.error)alert(r.error.message);else{modal.classList.remove('open');load()}}load()}</script></body></html>
