<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">SHOP</a><nav id="site-nav"></nav></div></header><main class="container" style="padding:35px 0"><h1>Cart</h1><div id="view"></div></main><script type="module">import'./js/config.js';import{shell,cart,total,money,esc,save}from'./js/app.js';await shell('cart');function draw(){let c=cart();view.innerHTML=!c.length?'<div class="empty">Your cart is empty.<br><br><a class="btn" href="shop.html">Shop now</a></div>`:`<div class="grid">${c.map(x=>`<div class="panel between"><div><strong>${esc(x.name)}</strong><div>${money(x.price)}</div></div><div class="row"><button class="btn secondary" data-m="${x.id}">−</button><span>${x.qty}</span><button class="btn secondary" data-p="${x.id}">+</button></div></div>`).join('')}<div class="panel between"><strong>Total</strong><strong class="price">${money(total())}</strong><a class="btn" href="checkout.html">Checkout</a></div></div>`};view.onclick=e=>{let c=cart(),b=e.target.closest('button');if(!b)return;let x=c.find(a=>a.id===(b.dataset.m||b.dataset.p));x.qty+=b.dataset.p?1:-1;if(x.qty<1)c=c.filter(a=>a.id!==x.id);save(c);draw()};draw()</script></body></html>
