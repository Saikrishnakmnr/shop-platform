<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container" style="max-width:500px;padding:60px 0"><a class="brand" href="index.html">SHOP</a><div class="panel" style="margin-top:20px"><h1>Sign in</h1><form id="form" class="grid"><input id="email" class="input" type="email" required placeholder="Email"><input id="password" class="input" type="password" required placeholder="Password"><button class="btn">Sign in</button></form><button id="google" class="btn secondary" style="width:100%;margin-top:10px">Continue with Google</button><p id="msg" class="muted"></p><a href="signup.html">Create account</a></div></main><script type="module">import'./js/config.js';import{supabase}from'./js/supabase.js';form.onsubmit=async e=>{e.preventDefault();let{error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?.message||'';if(!error)location.href='account.html'};google.onclick=async()=>{let{error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/auth-callback.html`}});if(error)msg.textContent=error.message}</script></body></html>
