<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">SHOP</a><nav id="site-nav"></nav></div></header><main class="container" style="padding:35px 0"><div id="view" class="panel">Loading…</div></main><script type="module">import'./js/config.js';import{shell,add,money,image,esc}from'./js/app.js';import{supabase}from'./js/supabase.js';await shell('shop');let slug=new URLSearchParams(location.search).get('slug');let{data:p}=await supabase.from('products').select('*').eq('slug',slug).maybeSingle();view.innerHTML=p?`<div class="hero-grid"><img src="${image(p)}" style="width:100%;border-radius:18px"><div><h1>${esc(p.name)}</h1><p>${esc(p.description||'')}</p><div class="price">${money(p.sale_price??p.price)}</div><div class="row" style="margin-top:18px"><input id="qty" class="input" type="number" min="1" value="1" style="max-width:100px"><button id="addbtn" class="btn">Add to cart</button></div></div></div>`:'<div class="empty">Product not found.</div>';if(p)addbtn.onclick=()=>add(p,Number(qty.value)||1)</script></body></html>
