<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">SHOP</a><nav id="site-nav"></nav></div></header><main class="container" style="padding:35px 0"><div id="view">Loading…</div></main><div class="bottom"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="account.html">Account</a></div><script type="module">import'./js/config.js';import{shell,user,profile,signout,esc}from'./js/app.js';await shell('account');let u=await user(),p=await profile();view.innerHTML=!u?'<div class="panel"><h1>Account</h1><p>Please sign in.</p><a class="btn" href="login.html">Sign in</a></div>`:`<div class="panel"><h1>Account</h1><p>${esc(u.email)}</p><p class="muted">Role: <strong>${esc(p?.role||'customer')}</strong></p><div class="row"><a class="btn secondary" href="orders.html">My Orders</a>${p?.role==='admin'?'<a class="btn" href="admin/index.html">Admin Dashboard</a>':''}<button id="out" class="btn danger">Sign out</button></div></div>`;if(u)out.onclick=signout</script></body></html>
