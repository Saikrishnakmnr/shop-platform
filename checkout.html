<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">SHOP</a><nav id="site-nav"></nav></div></header><main class="container" style="max-width:750px;padding:35px 0"><h1>Checkout</h1><div class="panel"><form id="form" class="grid"><input id="name" class="input" required placeholder="Full name"><input id="phone" class="input" required placeholder="Phone"><textarea id="address" class="input" required placeholder="Full delivery address"></textarea><input id="pincode" class="input" required placeholder="Pincode"><input id="coupon" class="input" placeholder="Coupon code"><div class="between"><b>Total</b><b id="total" class="price"></b></div><button class="btn">Place order</button></form><p id="msg" class="muted"></p></div></main><script type="module">import'./js/config.js';import{shell,user,cart,total}from'./js/app.js';import{supabase}from'./js/supabase.js';await shell('cart');let u=await user(),c=cart();if(!u)location.href='login.html';if(!c.length)location.href='cart.html';total.textContent='₹'+total();form.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating order…';let{data,error}=await supabase.rpc('create_order',{p_items:c.map(x=>({product_id:x.id,quantity:x.qty})),p_name:name.value,p_phone:phone.value,p_address:address.value,p_pincode:pincode.value,p_coupon:coupon.value||null});if(error)msg.textContent=error.message;else{localStorage.removeItem('shop_cart');location.href='orders.html'}}</script></body></html>
