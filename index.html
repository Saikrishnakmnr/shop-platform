<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container" style="padding:35px 0"><a class="brand" href="../index.html">SHOP</a><div id="view" class="panel" style="margin-top:20px">Loading…</div></main><script type="module">import'../js/config.js';import{role,esc,money}from'../js/app.js';import{supabase}from'../js/supabase.js';let p=await role(['delivery_worker']);if(p){{let{{data}}=await supabase.from('orders').select('*').eq('delivery_worker_id',p.id).in('status',['READY','OUT_FOR_DELIVERY']);view.innerHTML=`<h1>My deliveries</h1>${{(data||[]).map(o=>`<div class="panel" style="margin:10px 0"><strong>#${{o.order_number}}</strong><p>${{esc(o.delivery_address)}}</p><p>${{money(o.total)}}</p><button class="btn" data-id="${{o.id}}">Mark out for delivery</button></div>`).join('')||'<div class="empty">No deliveries.</div>'}}`;view.onclick=async e=>{{let b=e.target.closest('[data-id]');if(b){{await supabase.from('orders').update({{status:'OUT_FOR_DELIVERY'}}).eq('id',b.dataset.id);location.reload()}}}}}}</script></body></html>
