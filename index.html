<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOP</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">SHOP</a><nav id="site-nav"></nav></div></header><main><section class="hero"><div class="container hero-grid"><div><div class="muted">LOCAL • FAST • SIMPLE</div><h1>Everything you need.<br><span style="color:var(--accent)">One SHOP.</span></h1><p>Groceries, household essentials, pickles, plastics and everyday products.</p><a class="btn" href="shop.html">Start Shopping</a></div><div class="panel"><h2>Welcome to SHOP</h2><p class="muted">Simple local shopping with delivery, orders and secure accounts.</p></div></div></section><section class="container"><div class="between"><h2>Featured products</h2><a class="muted" href="shop.html">View all →</a></div><div id="products" class="grid products"></div></section></main><footer class="footer"><div class="container">© SHOP</div></footer><div class="bottom"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="account.html">Account</a></div><script type="module">import './js/config.js';import{shell,add,money,image,esc}from'./js/app.js';import{supabase}from'./js/supabase.js';await shell('home');let{data}=await supabase.from('products').select('*').eq('active',true).order('featured',{ascending:false}).limit(8);products.innerHTML=(data||[]).map(p=>`<article class="panel product"><a href="product.html?slug=${encodeURIComponent(p.slug)}"><img src="${image(p)}"><h3>${esc(p.name)}</h3></a><div class="between"><span class="price">${money(p.sale_price??p.price)}</span><button class="btn" data-id="${p.id}">Add</button></div></article>`).join('')||'<div class="empty">No products yet.</div>';products.onclick=e=>{let b=e.target.closest('[data-id]');if(b)add(data.find(x=>x.id===b.dataset.id))}</script></body></html>
