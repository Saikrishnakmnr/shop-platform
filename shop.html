<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><div class="container nav"><a class="brand" href="index.html">SHOP</a><nav id="site-nav"></nav></div></header><main class="container" style="padding:35px 0"><h1>Shop</h1><div class="search"><input id="search" class="input" placeholder="Search products"><select id="cat" class="input" style="max-width:250px"><option value="">All categories</option></select></div><div id="products" class="grid products"></div></main><div class="bottom"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="account.html">Account</a></div><script type="module">import'./js/config.js';import{shell,add,money,image,esc}from'./js/app.js';import{supabase}from'./js/supabase.js';await shell('shop');let[{data:p},{data:c}]=await Promise.all([supabase.from('products').select('*').eq('active',true).order('name'),supabase.from('categories').select('*').eq('active',true).order('name')]);cat.innerHTML+=(c||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');function draw(){let q=search.value.toLowerCase(),z=cat.value,x=(p||[]).filter(a=>(!q||a.name.toLowerCase().includes(q))&&(!z||a.category_id===z));products.innerHTML=x.map(a=>`<article class="panel product"><a href="product.html?slug=${encodeURIComponent(a.slug)}"><img src="${image(a)}"><h3>${esc(a.name)}</h3></a><div class="between"><span class="price">${money(a.sale_price??a.price)}</span><button class="btn" data-id="${a.id}">Add</button></div></article>`).join('')||'<div class="empty">No matching products.</div>'};products.onclick=e=>{let b=e.target.closest('[data-id]');if(b)add((p||[]).find(x=>x.id===b.dataset.id))};search.oninput=draw;cat.onchange=draw;draw()</script></body></html>
